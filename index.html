<!DOCTYPE html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>FuzzyBit Mind-Map Business Modelling Framework</title>
        <script type="text/javascript" src="mind-map.js"></script>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 24px;
                color: #172b3a;
                font-family: Arial, sans-serif;
                background: #f4f8ff;
            }

            .model-layout {
                display: grid;
                grid-template-columns: minmax(0, 680px) minmax(360px, 520px);
                align-items: center;
                justify-content: center;
                gap: 24px;
                max-width: 1240px;
                margin: 0 auto;
            }

            .mind-map {
                display: block;
                width: 100%;
                height: auto;
                border: 1px solid #aaa;
                background: #7ce0ff;
            }

            .mind-map circle[aria-pressed="true"] {
                fill: #1769aa;
                stroke: #fff;
                stroke-width: 3px;
            }

            .mind-map line[id^="id_1_"] {
                pointer-events: none;
            }

            .mind-map circle[id^="id_0_"][data-stream-active="false"] {
                fill: #8794a0;
                opacity: 0.45;
            }

            .mind-map circle[id^="id_0_"][data-stream-active="true"][data-stream="EX"] { fill: #7651a8; }
            .mind-map circle[id^="id_0_"][data-stream-active="true"][data-stream="AN"] { fill: #c06b22; }
            .mind-map circle[id^="id_0_"][data-stream-active="true"][data-stream="RE"] { fill: #087f8c; }
            .mind-map circle[id^="id_0_"][data-stream-active="true"][data-stream="PR"] { fill: #32804a; }

            .areas-panel h1 {
                margin: 0 0 8px;
                font-size: 1.5rem;
            }

            .areas-panel p {
                margin: 0 0 16px;
                color: #455b6a;
                line-height: 1.45;
            }

            .area-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }

            .area-grid-frame {
                display: block;
            }

            .stream-labels {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                margin-bottom: 8px;
            }

            .stream-label {
                padding: 6px 9px;
                border: 0;
                border-radius: 999px;
                color: #fff;
                font-size: 0.68rem;
                font-weight: 700;
                letter-spacing: 0.035em;
                line-height: 1.1;
                font-family: inherit;
                cursor: pointer;
            }

            .stream-label:focus-visible {
                outline: 3px solid #1769aa;
                outline-offset: 2px;
            }

            .stream-label[data-stream-active="true"] {
                box-shadow: 0 0 0 3px #172b3a;
            }

            .stream-label--executive {
                background: #7651a8;
            }

            .stream-label--analytical {
                background: #c06b22;
            }

            .stream-label--financial {
                background: #087f8c;
            }

            .stream-label--production {
                background: #32804a;
            }

            .area-card {
                display: flex;
                min-height: 112px;
                flex-direction: column;
                justify-content: center;
                align-items: flex-start;
                padding: 12px;
                border: 1px solid #cbd6df;
                border-left: 2px solid #718096;
                border-radius: 8px;
                color: #172b3a;
                text-align: left;
                font: inherit;
                background: #fff;
                cursor: pointer;
                transition: box-shadow 120ms ease, transform 120ms ease, background-color 120ms ease;
            }

            .area-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgb(23 43 58 / 14%);
            }

            .area-card:focus-visible {
                outline: 3px solid #1769aa;
                outline-offset: 2px;
            }

            .area-card[aria-pressed="true"] {
                border-width: 5px;
            }

            .area-card[data-multi-selected="true"] {
                border-width: 4px;
            }

            .area-card[data-area-focused="true"] {
                border-width: 5px;
            }

            .area-card[data-stream-active="true"] {
                background: #edf5ff;
            }

            .area-card strong {
                font-size: 0.98rem;
                line-height: 1.25;
            }

            .area-card[data-stream="EX"] { border-left-color: #7651a8; }
            .area-card[data-stream="AN"] { border-left-color: #c06b22; }
            .area-card[data-stream="RE"] { border-left-color: #087f8c; }
            .area-card[data-stream="PR"] { border-left-color: #32804a; }
            .area-card[data-stream="EX"][data-area-focused="true"] { border-color: #7651a8; }
            .area-card[data-stream="AN"][data-area-focused="true"] { border-color: #c06b22; }
            .area-card[data-stream="RE"][data-area-focused="true"] { border-color: #087f8c; }
            .area-card[data-stream="PR"][data-area-focused="true"] { border-color: #32804a; }

            .area-card--center {
                align-items: center;
                justify-content: center;
                border: 2px solid #1769aa;
                text-align: center;
                background: #e8f3ff;
            }

            @media (max-width: 1050px) {
                .model-layout {
                    grid-template-columns: minmax(0, 680px);
                }
            }

            @media (max-width: 480px) {
                body {
                    padding: 12px;
                }

                .model-layout {
                    gap: 16px;
                }

                .area-grid {
                    gap: 6px;
                }

                .stream-labels {
                    gap: 4px;
                }

                .stream-label {
                    padding: 4px 5px;
                    font-size: 0.56rem;
                }

                .area-card {
                    min-height: 104px;
                    padding: 8px;
                }

                .area-card strong {
                    font-size: 0.82rem;
                }

            }
        </style>
    </head>
    <body onload="init()">
        <main class="model-layout">
            <svg class="mind-map" version="1.1"
                baseProfile="full"
                width="680"
                height="600"
                viewBox="0 0 680 600"
                xmlns="http://www.w3.org/2000/svg">
                <rect width="100%" height="100%" fill="rgb(124,224,255)" />
                <circle cx="300" cy="300" r="200" fill="lightblue" />
                <text x="235" y="25" font-size="20" text-anchor="middle" fill="black" font-family="arial">FuzzyBit Mind-Map Business Modelling Framework</text>
                <text x="56" y="588" font-size="20" text-anchor="middle" fill="black" font-family="arial" onclick="window.location='https://creativecommons.org/licenses/by-sa/4.0/';">CC BY-SA </text>
                <text x="170" y="588" font-size="20" text-anchor="middle" fill="black" font-family="arial" onclick="window.location='https://www.fuzzybit.com/';">fuzzybit.com </text>
                <text x="360" y="588" font-size="20" text-anchor="middle" fill="black" font-family="arial" onclick="window.location='mailto:mind-map@fuzzybit.com';">&lt;mind-map@fuzzybit.com&gt;</text>

                <!-- STREAM -->
                <line id="EX" stroke="black" stroke-width="1" />
                <text id="EX_label" font-size="18" text-anchor="left" fill="black" font-family="arial" onclick="s.click('EX', event.ctrlKey);"></text>

                <line id="PR" stroke="black" stroke-width="1" />
                <text id="PR_label" font-size="18" text-anchor="left" fill="black" font-family="arial" onclick="s.click('PR', event.ctrlKey);"></text>

                <line id="RE" stroke="black" stroke-width="1" />
                <text id="RE_label" font-size="18" text-anchor="left" fill="black" font-family="arial" onclick="s.click('RE', event.ctrlKey);"></text>

                <line id="AN" stroke="black" stroke-width="1" />
                <text id="AN_label" font-size="18" text-anchor="left" fill="black" font-family="arial" onclick="s.click('AN', event.ctrlKey);"></text>

                <!-- AREAS -->
                <circle id="PS" fill="black" onclick="resetMap();" />
                <text id="PS_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="resetMap();"></text>

                <circle id="MV" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="MV_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('MV', event.ctrlKey);"></text>

                <circle id="GP" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="GP_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('GP', event.ctrlKey);"></text>

                <circle id="FI" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="FI_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('FI', event.ctrlKey);"></text>

                <circle id="SM" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="SM_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('SM', event.ctrlKey);"></text>

                <circle id="MA" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="MA_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('MA', event.ctrlKey);"></text>

                <circle id="RA" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="RA_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('RA', event.ctrlKey);"></text>

                <circle id="ML" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="ML_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('ML', event.ctrlKey);"></text>

                <circle id="OP" fill="black" onclick="selectArea(this.id, event.ctrlKey);" />
                <text id="OP_label" font-size="18" text-anchor="middle" fill="black" font-family="arial" onclick="selectArea('OP', event.ctrlKey);"></text>
            </svg>

            <section class="areas-panel" aria-labelledby="areas-title">
                <h1 id="areas-title">Business model areas</h1>
                <p>Select an area to focus it or a stream to show its line. Hold Ctrl while selecting to toggle multiple streams or areas.</p>
                <div class="area-grid-frame">
                    <div class="stream-labels" aria-label="Business model streams">
                        <button class="stream-label stream-label--executive" type="button" data-stream="EX" data-stream-active="false" aria-pressed="false" onclick="s.click('EX', event.ctrlKey);">EXECUTIVE</button>
                        <button class="stream-label stream-label--analytical" type="button" data-stream="AN" data-stream-active="false" aria-pressed="false" onclick="s.click('AN', event.ctrlKey);">ANALYTICAL</button>
                        <button class="stream-label stream-label--financial" type="button" data-stream="RE" data-stream-active="false" aria-pressed="false" onclick="s.click('RE', event.ctrlKey);">FINANCIAL</button>
                        <button class="stream-label stream-label--production" type="button" data-stream="PR" data-stream-active="false" aria-pressed="false" onclick="s.click('PR', event.ctrlKey);">PRODUCTION</button>
                    </div>
                    <div class="area-grid" aria-label="Nine business model areas">
                        <button class="area-card" type="button" data-area-card="ML" data-stream="PR" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Management &amp; Human Resources</strong>
                        </button>
                        <button class="area-card" type="button" data-area-card="MV" data-stream="EX" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Mission &amp; Vision</strong>
                        </button>
                        <button class="area-card" type="button" data-area-card="MA" data-stream="AN" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Market Analysis</strong>
                        </button>
                        <button class="area-card" type="button" data-area-card="FI" data-stream="RE" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Accounting</strong>
                        </button>
                        <button class="area-card area-card--center" type="button" data-area-card="PS" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Product / Service</strong>
                        </button>
                        <button class="area-card" type="button" data-area-card="SM" data-stream="RE" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Sales &amp; Marketing</strong>
                        </button>
                        <button class="area-card" type="button" data-area-card="RA" data-stream="AN" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Risk Analysis</strong>
                        </button>
                        <button class="area-card" type="button" data-area-card="GP" data-stream="EX" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Ethics / Law / By-laws</strong>
                        </button>
                        <button class="area-card" type="button" data-area-card="OP" data-stream="PR" data-stream-active="false" data-area-focused="false" aria-pressed="false">
                            <strong>Operations</strong>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
